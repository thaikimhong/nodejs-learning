<nav class="navbar">

        <span>សួស្តី <%= user.username %></span>
        <form method="POST" action="/logout">
            <button type="submit" class="link-btn">ចាកចេញ</button>
        </form>
    <% } else { %>
        <a href="/login">ចូលគណនី</a>
        <a href="/register">ចុះឈ្មោះ</a>
    <% } %>
</nav>
