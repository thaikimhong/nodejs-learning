<nav class="navbar">
    <a href="/" class="navbar-logo">Practice Lab</a>
    <div class="navbar-links">

            <span>Hi, <%= user.username %></span>
            <form method="POST" action="/logout">

        <% } else { %>
            <a href="/login" class="link-btn">Login</a>
            <a href="/register" class="link-btn">Register</a>
        <% } %>
    </div>
</nav>
