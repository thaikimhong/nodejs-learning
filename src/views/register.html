<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចុះឈ្មោះ</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container auth-page">
        <h1 class="page-title">ចុះឈ្មោះ</h1>

        <% if (error) { %>
            <p class="form-error"><%= error %></p>
        <% } %>

        <form class="auth-form" method="POST" action="/register">
            <label for="username">ឈ្មោះអ្នកប្រើ</label>
            <input type="text" id="username" name="username" required>

            <label for="email">អ៊ីមែល</label>
            <input type="email" id="email" name="email" required>

            <label for="password">ពាក្យសម្ងាត់</label>
            <input type="password" id="password" name="password" required minlength="6">

            <button type="submit" class="btn">ចុះឈ្មោះ</button>
        </form>

        <p class="auth-switch">មានគណនីរួចហើយ? <a href="/login">ចូលគណនី</a></p>
    </main>
</body>
</html>
